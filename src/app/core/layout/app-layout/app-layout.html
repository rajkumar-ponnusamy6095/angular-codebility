
<div
  class="app-layout"
  [class.sidebar-open]="sidebarOpen()"
  [class.sidebar-closed]="!sidebarOpen()"
  [class.mobile-view]="mobileView()">

  <app-header
    [sidebarOpen]="sidebarOpen()"
    [user]="currentUser()"
    [logoutError]="logoutError()"
    [accountError]="accountError()"
    (menuToggle)="toggleSidebar()"
    (logoutRequested)="handleLogout()">
  </app-header>

  <app-sidebar
    [isOpen]="sidebarOpen()"
    (navigationSelected)="onSidebarNavigationSelected()">
  </app-sidebar>

  @if (mobileView() && sidebarOpen()) {
    <button
      type="button"
      class="sidebar-backdrop"
      aria-label="Close navigation menu"
      (click)="closeSidebar()">
    </button>
  }

  <main class="app-layout-content" (click)="closeSidebar()">
    <router-outlet></router-outlet>
  </main>
</div>
